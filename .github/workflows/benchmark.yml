name: Benchmark

on:
  push:
    branches:
      - main

# This job only reads the repository and prints numbers.
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Polyfill overhead benchmark

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Compile
        run: bundle exec rake compile
      - name: Run benchmark
        run: bundle exec ruby benchmark/polyfills.rb
