name: Benchmark

on:
  push:
    branches:
      - main

# This job only reads the repository and prints numbers.
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Polyfill overhead benchmark

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Compile
        run: bundle exec rake compile
      - name: Run benchmark
        run: bundle exec ruby benchmark/polyfills.rb
